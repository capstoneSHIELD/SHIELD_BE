greeting:
  ko: "안녕하세요. 상담에 필요한 사실관계를 차근차근 정리해보겠습니다."
irrelevant:
  ko: "법률 상담과 관련된 사실관계를 알려주시면 필요한 정보를 정리해드리겠습니다."
ask_legal_advice:
  ko: "승소 가능성이나 법적 결론은 단정할 수 없습니다. 판단에 필요한 사실관계를 먼저 정리해드리겠습니다."
confirm_affirmative:
  ko: "확인했습니다. 다음으로 필요한 사실관계를 이어서 확인하겠습니다."
confirm_negative:
  ko: "알겠습니다. 올바른 내용을 다시 알려주세요."
