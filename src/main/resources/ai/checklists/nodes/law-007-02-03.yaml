items:
  - "\uc0c1\uac00\uac74\ubb3c \uc8fc\uc18c, \ud638\uc218, \uc601\uc5c5\uc6a9 \uc0ac\uc6a9 \uc5ec\ubd80"
  - "\uc784\ub300\ucc28 \uc2dc\uc791\uc77c, \ub9cc\ub8cc\uc77c, \uc885\ub8cc \ud1b5\uc9c0 \ub610\ub294 \uac31\uc2e0\uac70\uc808 \uc2dc\uc810"
  - "\ubcf4\uc99d\uae08\u00b7\ucc28\uc784\uacfc 3\uae30 \ucc28\uc784\uc561 \uc5f0\uccb4 \uc5ec\ubd80"
  - "\uc601\uc5c5\uc2dc\uc124\u00b7\ube44\ud488\u00b7\uac70\ub798\ucc98\u00b7\uc2e0\uc6a9\u00b7\ub178\ud558\uc6b0 \ub4f1 \uad8c\ub9ac\uae08 \uad6c\uc131 \uc694\uc18c"
  - "\uc2e0\uaddc\uc784\ucc28\uc778\uacfc \uad8c\ub9ac\uae08 \uacc4\uc57d \uccb4\uacb0 \uc5ec\ubd80, \uad8c\ub9ac\uae08 \uc57d\uc815 \uae08\uc561"
  - "\uc2e0\uaddc\uc784\ucc28\uc778 \uc8fc\uc120\uc77c, \uc778\uc801\uc0ac\ud56d, \uc784\ub300\uc778\uc5d0\uac8c \uc804\ub2ec\ud55c \uc790\ub8cc"
  - "\uc2e0\uaddc\uc784\ucc28\uc778\uc758 \ubcf4\uc99d\uae08\u00b7\ucc28\uc784 \uc9c0\uae09 \ub2a5\ub825\uacfc \uc758\ubb34 \uc774\ud589 \uad00\ub828 \uc815\ubcf4"
  - "\uc784\ub300\uc778\uc758 \uad8c\ub9ac\uae08 \uc694\uad6c, \uc218\uc218, \uc9c0\uae09 \ubc29\ud574, \uace0\uc561 \ucc28\uc784\u00b7\ubcf4\uc99d\uae08 \uc694\uad6c, \uacc4\uc57d \uac70\uc808 \ub0b4\uc6a9"
  - "\ucca0\uac70\u00b7\uc7ac\uac74\ucd95, 1\ub144 6\uac1c\uc6d4 \ube44\uc601\ub9ac \uc0ac\uc6a9, \ub300\uaddc\ubaa8\uc810\ud3ec\u00b7\uad6d\uacf5\uc720\uc7ac\uc0b0 \ub4f1 \uc608\uc678 \uc0ac\uc720"
