  - "\uc9c4\uc815\u00b7\uace0\uc18c\u00b7\uc18c\uc1a1\u00b7\uc9c0\uae09\uba85\ub839\u00b7\uc870\uc815\u00b7\ud310\uacb0 \uc9c4\ud589 \uc0c1\ud0dc"
  - "\uccb4\ubd88\uc784\uae08\ub4f1\u00b7\uc0ac\uc5c5\uc8fc \ud655\uc778\uc11c, \ub300\uc9c0\uae09\uae08 \uc2e0\uccad, \ubc30\ub2f9\uc694\uad6c \uc9c4\ud589 \uc0c1\ud0dc"
