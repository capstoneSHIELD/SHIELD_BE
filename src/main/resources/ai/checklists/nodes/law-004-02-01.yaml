  - "\ud1f4\uc9c1\uc77c \uc774\ud6c4 \uae08\ud488 \uccad\uc0b0 \uc694\uccad\uc77c\uacfc \uc0ac\uc6a9\uc790 \ub2f5\ubcc0"
