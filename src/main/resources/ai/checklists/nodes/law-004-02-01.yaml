items:
  - "\uadfc\ubb34 \uc0ac\uc5c5\uc7a5\uba85, \uc0ac\uc6a9\uc790\uba85, \uc0ac\uc5c5\uc790\ub4f1\ub85d \uc5ec\ubd80"
  - "\uadfc\ub85c \uc2dc\uc791\uc77c, \uc885\ub8cc\uc77c, \uc7ac\uc9c1 \ub610\ub294 \ud1f4\uc9c1 \uc0c1\ud0dc"
