items:
  - "\uc784\ub300\ucc28 \uc720\ud615(\uc8fc\ud0dd/\uc0c1\uac00)\uacfc \ubaa9\uc801\ubb3c \uc8fc\uc18c\u00b7\ud638\uc218\u00b7\uc784\ucc28 \ubc94\uc704"
  - "\uc784\ub300\ucc28\uacc4\uc57d \uccb4\uacb0\uc77c, \uc885\ub8cc\uc77c, \uc885\ub8cc \uc0ac\uc720"
  - "\ubc18\ud658\ub418\uc9c0 \uc54a\uc740 \ubcf4\uc99d\uae08 \ub610\ub294 \uc804\uc138\uae08 \uae08\uc561\uacfc \ubc18\ud658 \uc694\uccad \ub0b4\uc5ed"
  - "\uc2e0\uccad\uc778, \uc784\ub300\uc778, \ub300\ub9ac\uc778 \uc778\uc801\uc0ac\ud56d\uacfc \ubc95\uc778\u00b7\ub2e8\uccb4 \uc5ec\ubd80"
  - "\uc8fc\ud0dd \uc778\ub3c4\u00b7\uc8fc\ubbfc\ub4f1\ub85d\uc77c \ub610\ub294 \uc0c1\uac00 \uc778\ub3c4\u00b7\uc0ac\uc5c5\uc790\ub4f1\ub85d \uc2e0\uccad\uc77c"
  - "\ud655\uc815\uc77c\uc790 \ubd80\uc5ec\uc77c\uacfc \uc784\ub300\ucc28\uacc4\uc57d\uc11c \ubcf4\uc720 \uc5ec\ubd80"
  - "\ub4f1\uae30\uc0ac\ud56d\uc99d\uba85\uc11c\uc0c1 \uc18c\uc720\uc790, \ubbf8\ub4f1\uae30 \uac74\ubb3c \uc5ec\ubd80, \uc18c\uc720\uad8c\ubcf4\uc874 \uc99d\ube59"
  - "\uc77c\ubd80 \uc784\ucc28 \ubaa9\uc801\ubb3c \ub3c4\uba74\uacfc \uc8fc\uac70\uc6a9\u00b7\uc601\uc5c5\uc6a9 \uc0ac\uc6a9 \uc99d\ube59 \ubcf4\uc720 \uc5ec\ubd80"
  - "\uc784\ucc28\uad8c\ub4f1\uae30\uba85\ub839 \uc2e0\uccad\u00b7\uacb0\uc815\u00b7\uc1a1\ub2ec\u00b7\ucd09\ud0c1\u00b7\ub4f1\uae30\uc644\ub8cc\u00b7\ub9d0\uc18c \uc0c1\ud0dc, \ud1f4\uac70\uc77c, \uc2e0\uccad \ube44\uc6a9"
