items:
  - "\uadfc\ubb34 \uc0ac\uc5c5\uc7a5\uba85, \uc0ac\uc6a9\uc790\uba85, \uc0c1\uc2dc \uadfc\ub85c\uc790 \uc218"
  - "\uadfc\ub85c\uacc4\uc57d \ud615\ud0dc, \ub2f4\ub2f9 \uc5c5\ubb34, \uadfc\ub85c \uc2dc\uc791\uc77c"
  - "\ucc98\ubd84 \uc720\ud615(\ud574\uace0\u00b7\ud734\uc9c1\u00b7\uc815\uc9c1\u00b7\uc804\uc9c1\u00b7\uac10\ubd09 \ub4f1)\uacfc \ud1b5\ubcf4\uc77c"
  - "\uc0ac\uc6a9\uc790\uac00 \uc81c\uc2dc\ud55c \ucc98\ubd84 \uc0ac\uc720\uc640 \uad00\ub828 \uc790\ub8cc"
  - "\ud574\uace0\uc0ac\uc720\u00b7\ud574\uace0\uc2dc\uae30\uac00 \uc801\ud78c \uc11c\uba74 \ub610\ub294 \uc804\uc790\ubb38\uc11c \ubcf4\uc720 \uc5ec\ubd80"
  - "\ud574\uace0\uc608\uace0\uc77c, \uadfc\ub85c \uc885\ub8cc\uc77c, \ud574\uace0\uc608\uace0\uc218\ub2f9 \uc9c0\uae09 \uc5ec\ubd80"
  - "\uc9d5\uacc4\uc704\uc6d0\ud68c\u00b7\uc778\uc0ac\uc704\uc6d0\ud68c \uac1c\ucd5c\uc77c, \ucd9c\uc11d\u00b7\uc18c\uba85 \uae30\ud68c, \ud68c\uc758\uc790\ub8cc \ubcf4\uc720 \uc5ec\ubd80"
  - "\uad6c\uc81c\uc2e0\uccad \uc811\uc218\uc77c, \uc9c0\ubc29\ub178\ub3d9\uc704\uc6d0\ud68c\u00b7\uc911\uc559\ub178\ub3d9\uc704\uc6d0\ud68c \uc9c4\ud589 \ub2e8\uacc4"
  - "\uc6d0\uc9c1\ubcf5\uc9c1 \ud76c\ub9dd \uc5ec\ubd80, \uae08\uc804\ubcf4\uc0c1 \uc694\uccad \uc5ec\ubd80, \ud574\uace0\uae30\uac04 \uc784\uae08 \uc790\ub8cc"
