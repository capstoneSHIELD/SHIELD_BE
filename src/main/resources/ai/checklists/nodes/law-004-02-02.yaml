items:
  - "\uc784\uae08 \uc0b0\uc815 \uae30\uac04\uacfc \uc0b0\uc815 \uc0ac\uc720 \ubc1c\uc0dd\uc77c"
  - "\uae30\ubcf8\uae09, \uc9c1\ubb34\uc218\ub2f9, \uc9c1\ucc45\uc218\ub2f9 \ub4f1 \uace0\uc815 \uc9c0\uae09 \ud56d\ubaa9"
  - "\uc0c1\uc5ec\uae08, \uc131\uacfc\uae09, \uc2dd\ub300, \uad50\ud1b5\ube44 \ub4f1 \uc9c0\uae09 \ud56d\ubaa9\uacfc \uc9c0\uae09 \uc8fc\uae30"
  - "\uac01 \uc784\uae08 \ud56d\ubaa9\uc758 \uc9c0\uae09 \uc870\uac74\uacfc \uc9c0\uae09 \uc81c\uc678 \uc870\uac74"
  - "\uc18c\uc815\uadfc\ub85c\uc2dc\uac04, \ud1b5\uc0c1\uc784\uae08 \uc0b0\uc815 \uae30\uc900\uc2dc\uac04, \uc2e4\uc81c \uadfc\ubb34\uc77c\uc218"
  - "\ud3c9\uade0\uc784\uae08 \uc0b0\uc815 \uc804 3\uac1c\uc6d4 \uc784\uae08 \ucd1d\uc561\uacfc \ucd1d \uc77c\uc218"
  - "\ud734\uc5c5, \ud734\uc9c1, \ucd9c\uc0b0\uc804\ud6c4\ud734\uac00, \uc5c5\ubb34\uc0c1 \uc7ac\ud574, \uc7c1\uc758\ud589\uc704 \ub4f1 \uc81c\uc678 \uae30\uac04"
  - "\ud1f4\uc9c1\uae08, \ud734\uc5c5\uc218\ub2f9, \uc5f0\uc7a5\u00b7\uc57c\uac04\u00b7\ud734\uc77c\uc218\ub2f9 \ub4f1 \uc0b0\uc815 \ubaa9\uc801"
  - "\uc784\uae08\uba85\uc138\uc11c, \uae09\uc5ec\ub300\uc7a5, \ub2e8\uccb4\ud611\uc57d, \ucde8\uc5c5\uaddc\uce59 \ubcf4\uc720 \uc5ec\ubd80"
